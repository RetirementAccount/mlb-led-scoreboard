[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-led-scoreboard-fruit-catcher"
version = "0.1.0"
description = "A falling-fruit catching game with lives and a bomb to avoid, for the LED scoreboard's game suite"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'bullpen.mlbled.plugin']
"fruit_catcher" = "mlb_led_scoreboard_fruit_catcher:load"
